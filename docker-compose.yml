version: "3.8"

services:
  # =============================================================
  # PostGIS Spatial Database (PostgreSQL 16 + PostGIS 3.4)
  # =============================================================
  postgis:
    image: postgis/postgis:16-3.4
    container_name: maris-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maris_db}
      POSTGRES_USER: ${POSTGRES_USER:-maris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maris_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maris_user} -d ${POSTGRES_DB:-maris_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maris-network

  # =============================================================
  # MARIS FastAPI Analytics & Attribution Backend
  # =============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maris-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: "MARIS — Maritime AI Intelligence System"
      ENVIRONMENT: "production"
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-maris_user}:${POSTGRES_PASSWORD:-maris_secure_password_2026}@postgis:5432/${POSTGRES_DB:-maris_db}
      POSTGRES_SERVER: postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-maris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maris_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-maris_db}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]'
      ML_MODE: "mock"
      OCEAN_DATA_PROVIDER: "cached"
      OPENDRIFT_NUM_PARTICLES: 150
      OPENDRIFT_DURATION_HOURS: 24
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - maris-network

  # =============================================================
  # MARIS Next.js 16 Tactical UI Dashboard
  # =============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maris-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - maris-network

volumes:
  postgres_data:
    driver: local

networks:
  maris-network:
    driver: bridge
